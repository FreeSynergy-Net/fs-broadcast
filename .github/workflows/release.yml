# Release of FreeSynergy Broadcast on a version tag (fs-release caller, pinned).
name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy-Net/fs-release/.github/workflows/release.yml@15935ed0d847d522fcb43d93e340ad1b14809639
    with:
      # `fs-broadcast` holds the server (`fs-broadcast serve`) and the starter; `fs-broadcast-simple` is the frontend process.
      binaries: fs-broadcast,fs-broadcast-simple
      cargo-package: fs-broadcast-bin
      ignore-binaries: fs-broadcast-server
      name: fs-broadcast
      kind: app
      app-id: net.freesynergy.Broadcast
      macos: false
      windows-targets: ""   # Linux only for now: Unix sockets and Unix paths (Windows and macOS follow)
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
